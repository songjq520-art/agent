<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的 Agent</title>
<!--
  个性化说明（想改样子就改这里，不用动别的代码）：
  下面 :root 里是全部能改的颜色，改一个值、整页都跟着变。
    --accent：主色（按钮、自己发出的气泡、链接），默认是蓝色
    --bg：页面背景；--panel：侧边栏和顶栏的底色
    --bubble-user：自己消息的气泡底色；--bubble-ai：Agent 回答的气泡底色
    --text：正文颜色；--muted：灰色小字颜色
  标题、欢迎语、头像见下面 <body> 里标着“可改”的地方。
  想换深色主题：把 --bg 改成深色、--text 改成浅色、气泡颜色跟着调深就行。
-->
<style>
  :root {
    --accent: #2563eb;        /* 主色：按钮、自己气泡 */
    --accent-soft: #dbeafe;   /* 主色的浅色版：输入框聚焦时的边框 */
    --bg: #f7f7f5;            /* 页面背景 */
    --panel: #ffffff;         /* 侧边栏、顶栏底色 */
    --bubble-user: #2563eb;   /* 自己消息的气泡 */
    --bubble-user-text: #ffffff;
    --bubble-ai: #ffffff;     /* Agent 回答的气泡 */
    --bubble-ai-text: #1f2937;
    --text: #1f2937;          /* 正文颜色 */
    --muted: #6b7280;         /* 灰色小字 */
    --border: #e5e7eb;        /* 分隔线颜色 */
    --danger: #dc2626;        /* 危险/警告颜色 */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* ---------- 左侧边栏 ---------- */
  .sidebar {
    width: 260px;
    flex: none;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px 14px;
    gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  /* 头像：现在是一个 emoji 圆圈，想换成图片就把下面 .avatar 里的 emoji
     换成 <img src="你的图片地址" alt="">，再把 font-size 改小。 */
  .avatar {
    width: 44px; height: 44px; flex: none;
    border-radius: 50%;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .brand-name { font-size: 17px; font-weight: 700; line-height: 1.2; }
  .brand-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    cursor: pointer;
    text-align: left;
  }
  .btn:hover { background: var(--bg); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    text-align: center;
    font-weight: 600;
  }
  .btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
  .status {
    font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    line-height: 1.7;
    white-space: pre-line;
  }
  .status .warn { color: var(--danger); }
  .proposals {
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .proposals-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .proposals-title .count { color: var(--muted); font-weight: 400; }
  .proposal-empty { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .proposal {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 8px;
    background: var(--bg);
  }
  .proposal-text { font-size: 13px; line-height: 1.6; word-break: break-word; }
  .proposal-reason { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
  .proposal-meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .proposal-actions { display: flex; gap: 8px; margin-top: 8px; }
  .proposal-actions button {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 0;
    font-size: 13px;
    cursor: pointer;
    background: var(--panel);
    color: var(--text);
  }
  .proposal-actions button.confirm {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .proposal-actions button:disabled { opacity: 0.55; cursor: default; }
  .sidebar-foot { margin-top: auto; font-size: 11px; color: var(--muted); line-height: 1.6; }

  /* ---------- 右侧聊天区 ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .topbar .avatar { width: 34px; height: 34px; font-size: 18px; }
  .topbar-title { font-size: 15px; font-weight: 700; }
  .topbar-sub { font-size: 12px; color: var(--muted); }
  .chat {
    flex: 1; overflow-y: auto;
    padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
    max-width: 860px; width: 100%; margin: 0 auto;
  }
  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.ai { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 15px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--bubble-user); color: var(--bubble-user-text); border-bottom-right-radius: 4px; }
  .msg.ai .bubble { background: var(--bubble-ai); color: var(--bubble-ai-text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .msg.typing .bubble { color: var(--muted); font-style: italic; }
  .welcome {
    text-align: center; color: var(--muted);
    padding: 28px 12px 8px; font-size: 14px; line-height: 1.8;
  }
  .welcome b { color: var(--text); font-size: 16px; }

  /* ---------- 底部输入区 ---------- */
  .composer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .composer-inner { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  #input {
    flex: 1; resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 12px;
    font-size: 15px; line-height: 1.5;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none;
    max-height: 140px;
  }
  #input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-soft); }
  #send {
    flex: none;
    border: none; border-radius: 12px;
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600;
    padding: 0 20px; cursor: pointer;
  }
  #send:disabled { opacity: 0.55; cursor: default; }
  .hint { max-width: 860px; margin: 8px auto 0; font-size: 11px; color: var(--muted); text-align: center; }

  /* ---------- 手机上：侧边栏收起来，只留聊天 ---------- */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .msg { max-width: 92%; }
    .chat { padding: 14px 12px; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <!-- 可改：头像 emoji，想换就改这里 -->
      <div class="avatar">🤖</div>
      <div>
        <!-- 可改：名字和副标题 -->
        <div class="brand-name">我的 Agent</div>
        <div class="brand-sub">个人多模型智能助理</div>
      </div>
    </div>
    <button class="btn btn-primary" id="newChat">＋ 新对话</button>
    <div class="status" id="status">正在加载状态…</div>
    <div class="proposals" id="proposals">
      <div class="proposals-title">待确认的记忆提议 <span class="count" id="proposalCount"></span></div>
      <div id="proposalList"><div class="proposal-empty">正在加载…</div></div>
    </div>
    <div class="sidebar-foot">
      只在你自己的电脑上运行（<span id="origin">本机</span>），不上云，别人打不开。<br>
      对话历史只保存在内存里，重启服务后清空。<br>
      想改颜色、名字、头像：改本文件最上面 &lt;style&gt; 里 :root 的颜色，和标着“可改”的地方。
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <!-- 可改：顶栏头像和标题 -->
      <div class="avatar">🤖</div>
      <div>
        <div class="topbar-title">我的 Agent</div>
        <div class="topbar-sub" id="topStatus">正在连接…</div>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="welcome">
        <!-- 可改：欢迎语 -->
        <b>你好，我是你的 Agent 👋</b><br>
        问我问题吧，我会按任务类型选模型回答，并记好每一笔成本。
      </div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send">发送</button>
      </div>
      <div class="hint">按 Enter 发送 · 本月预算 $5，超支会自动暂停付费调用</div>
    </div>
  </div>

<script>
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const topStatusEl = document.getElementById('topStatus');
  let busy = false;

  function addMsg(role, text, meta) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    if (meta) {
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = meta;
      wrap.appendChild(m);
    }
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrap;
  }

  async function refreshStatus() {
    try {
      const res = await fetch('/api/status');
      const s = await res.json();
      const models = Object.entries(s.model_status || {})
        .filter(([, v]) => v.enabled)
        .map(([name, v]) => name + '（' + (v.model || '') + (v.has_api_key ? '，已接通' : '，未接 Key') + '）')
        .join('、');
      let text = '模型：' + (models || '无') +
        '\n本月成本：$' + s.total_cost_usd.toFixed(4) + ' / $' + s.monthly_budget_usd.toFixed(2) +
        '，剩余 $' + s.remaining_usd.toFixed(4);
      if (s.budget_corrupted) text += '\n⚠️ 预算记录异常，已暂停付费调用';
      else if (s.unknown_cost) text += '\n⚠️ 有未核对的未知成本，已暂停付费调用';
      statusEl.textContent = text;
      topStatusEl.textContent = s.budget_corrupted || s.unknown_cost
        ? '已暂停付费调用，请先检查预算'
        : '本月已用 $' + s.total_cost_usd.toFixed(4) + '，剩余 $' + s.remaining_usd.toFixed(4);
    } catch (e) {
      statusEl.textContent = '状态加载失败：服务没连上？';
      topStatusEl.textContent = '未连接';
    }
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    addMsg('user', text);
    const typing = addMsg('ai', '正在想…');
    typing.classList.add('typing');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      typing.remove();
      if (!res.ok || data.error) {
        addMsg('ai', '出错了：' + (data.error || ('HTTP ' + res.status)));
      } else if (data.mode === 'demo') {
        addMsg('ai', data.reply, '演示模式 · 未调用模型 · 未产生费用');
      } else {
        const cost = data.cost_usd === null || data.cost_usd === undefined
          ? '成本未知'
          : ('本次 $' + Number(data.cost_usd).toFixed(6));
        addMsg('ai', data.reply, (data.model || '') + ' · ' + cost);
      }
    } catch (e) {
      typing.remove();
      addMsg('ai', '出错了：连不上服务，请确认服务还在运行。');
    }
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
    refreshStatus();
    refreshProposals();
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });
  document.getElementById('newChat').addEventListener('click', async () => {
    if (busy) return;
    await fetch('/api/reset', { method: 'POST' });
    chatEl.querySelectorAll('.msg').forEach((el) => el.remove());
    addMsg('ai', '已开始新对话，之前的记录清空了。');
  });

  // ---------- 待确认的记忆提议 ----------
  // 每轮聊天成功后，后端会跑一次独立的记忆提取，把候选建成提议；
  // 这里只展示后端创建的提议（有真实 ID 和 pending 状态），
  // 用户点“保存”才写进长期记忆，点“不要”就不保存。
  // 提议只存在内存里，重启服务后未确认的会丢弃。
  const proposalListEl = document.getElementById('proposalList');
  const proposalCountEl = document.getElementById('proposalCount');

  async function refreshProposals() {
    try {
      const res = await fetch('/api/proposals');
      const data = await res.json();
      const proposals = data.proposals || [];
      proposalCountEl.textContent = proposals.length ? '（' + proposals.length + ' 条）' : '';
      proposalListEl.textContent = '';
      if (!proposals.length) {
        const empty = document.createElement('div');
        empty.className = 'proposal-empty';
        empty.textContent = '暂无待确认的提议。聊天后，值得长期记住的信息会出现在这里。';
        proposalListEl.appendChild(empty);
        return;
      }
      proposals.forEach((p) => {
        const card = document.createElement('div');
        card.className = 'proposal';
        const text = document.createElement('div');
        text.className = 'proposal-text';
        text.textContent = p.text;
        card.appendChild(text);
        if (p.reason) {
          const reason = document.createElement('div');
          reason.className = 'proposal-reason';
          reason.textContent = '建议理由：' + p.reason;
          card.appendChild(reason);
        }
        const meta = document.createElement('div');
        meta.className = 'proposal-meta';
        meta.textContent = (p.layers || []).join('、') + ' · ' + (p.date || '');
        card.appendChild(meta);
        const actions = document.createElement('div');
        actions.className = 'proposal-actions';
        const confirmBtn = document.createElement('button');
        confirmBtn.className = 'confirm';
        confirmBtn.textContent = '保存';
        confirmBtn.addEventListener('click', () => decideProposal(p.id, 'confirm', confirmBtn, rejectBtn));
        const rejectBtn = document.createElement('button');
        rejectBtn.textContent = '不要';
        rejectBtn.addEventListener('click', () => decideProposal(p.id, 'reject', confirmBtn, rejectBtn));
        actions.appendChild(confirmBtn);
        actions.appendChild(rejectBtn);
        card.appendChild(actions);
        proposalListEl.appendChild(card);
      });
    } catch (e) {
      proposalListEl.textContent = '';
      const err = document.createElement('div');
      err.className = 'proposal-empty';
      err.textContent = '提议加载失败：服务没连上？';
      proposalListEl.appendChild(err);
    }
  }

  async function decideProposal(id, action, confirmBtn, rejectBtn) {
    confirmBtn.disabled = true;
    rejectBtn.disabled = true;
    try {
      const res = await fetch('/api/proposals/' + encodeURIComponent(id) + '/' + action, { method: 'POST' });
      const data = await res.json();
      if (!res.ok || data.error) {
        alert('操作失败：' + (data.error || ('HTTP ' + res.status)));
      }
    } catch (e) {
      alert('操作失败：连不上服务，请确认服务还在运行。');
    }
    refreshProposals();
  }

  // 侧边栏显示当前实际地址（端口改了也能对上，不用在 HTML 里写死地址）。
  document.getElementById('origin').textContent = window.location.origin;

  refreshStatus();
  refreshProposals();
  inputEl.focus();
</script>
</body>
</html>
